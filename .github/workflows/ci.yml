name: LeadMap AI Master CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  workspace-integrity:
    name: Monorepo Integrity & Configurations Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Validate Docker Compose Configuration
        run: |
          python3 -c "import yaml; yaml.safe_load(open('docker-compose.yml'))"

      - name: Check Environment Template Integrity
        run: |
          test -f .env.example
          grep -q "APP_KEY=" .env.example
          grep -q "DB_DATABASE=" .env.example
          grep -q "NEXT_PUBLIC_API_URL=" .env.example

      - name: Validate Backup Scripts Executable Permissions
        run: |
          test -x infrastructure/scripts/backup-postgres.sh || chmod +x infrastructure/scripts/*.sh
          bash -n infrastructure/scripts/backup-postgres.sh
          bash -n infrastructure/scripts/restore-postgres.sh
