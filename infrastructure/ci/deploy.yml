name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Shared Types
        run: npm run build:types

      - name: Build Next.js Application
        run: npm run build:web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Package artifacts
        run: |
          cd apps/web
          tar --exclude='.next/cache' -czf ../../leadmaps-deploy.tar.gz .next public server.js package.json next.config.ts
          cd ../..

      - name: Deploy to Hostinger via SSH
        uses: appleboy/scp-action@master
        if: env.SSH_HOST != ''
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 65002 }}
          source: "leadmaps-deploy.tar.gz"
          target: "/home/${{ secrets.HOSTINGER_USER }}/domains/leadmaps.in/public_html/apps/web"

      - name: Restart Application on Hostinger
        uses: appleboy/ssh-action@master
        if: env.SSH_HOST != ''
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 65002 }}
          script: |
            cd /home/${{ secrets.HOSTINGER_USER }}/domains/leadmaps.in/public_html/apps/web
            tar -xzf leadmaps-deploy.tar.gz
            rm -f leadmaps-deploy.tar.gz
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            pm2 restart leadmaps || pm2 start server.js --name "leadmaps"
            pm2 save
